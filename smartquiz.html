<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Smart Quiz - Self Study</title>
<link rel="stylesheet" href="style.css">

<style>

.quiz-card {
    background: rgba(255,255,255,0.05);
    padding: 30px;
    border-radius: 15px;
    margin-top: 40px;
    text-align: center;
}

.quiz-card textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 15px;
}

.quiz-card button {
    margin-top: 15px;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.quiz-card button:hover {
    background: #1d4ed8;
}

.placeholder-text {
    opacity: 0.7;
    margin-top: 20px;
}

</style>
</head>

<body>

<!-- 🔐 Protect Page -->
<script>
if(!sessionStorage.getItem("userId")){
    window.location.href = "login.html";
}
</script>

<div class="sidebar">
    <div>
        <div class="sidebar-header">
    <div class="dashboard-btn" onclick="goDashboard()">☰</div>
    <h2>HOME</h2>
</div>

        <ul>
            <li onclick="location.href='materials.html'">Materials</li>
            <li onclick="location.href='chatbot.html'">AI Chatbot</li>
            <li onclick="location.href='summariser.html'">AI Summariser</li>
            <li class="active">AI Smart Quiz</li>
            <li onclick="location.href='timetable.html'">Timetable</li>
            <li onclick="location.href='assignments.html'">Assignment Tracker</li>
            <li onclick="location.href='grades.html'">Grades</li>
            <li onclick="location.href='progress.html'">Progress Tracker</li>
        </ul>
    </div>

    <div class="logout" onclick="logout()">Logout</div>
</div>

<div class="main">

    <!-- Header -->
    <div class="header">
        <div style="display:flex;align-items:center;">
            <img src="logo.jpeg" class="logo">
            <h1>Self Study</h1>
        </div>
    </div>

    <!-- Quiz Section -->
    <div class="quiz-card">

        <h2>AI Smart Quiz Generator</h2>

        <p>Enter topic to generate quiz questions.</p>

        <textarea placeholder="Enter topic..."></textarea>

        <button onclick="generateQuiz()">Generate Quiz</button>

        <div id="quizOutput" class="placeholder-text">
            Quiz questions will appear here.
        </div>

    </div>

</div>

<script>

function generateQuiz(){

    const textarea = document.querySelector("textarea");
    const text = textarea.value.trim();
    const output = document.getElementById("quizOutput");

    if(!text){
        alert("Please enter topic or study material.");
        return;
    }

    output.innerHTML = "Generating quiz...";

    fetch("http://localhost:5000/api/quiz", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {
        output.innerHTML = data.quiz.replace(/\n/g, "<br>");
    })
    .catch(err => {
        console.error(err);
        output.innerHTML = "Error generating quiz.";
    });
}

function logout(){
    sessionStorage.removeItem("userId");
    window.location.href = "login.html";
}

</script>
<script>
function goDashboard(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
