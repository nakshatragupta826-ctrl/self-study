<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chatbot - Self Study</title>
<link rel="stylesheet" href="style.css">

<style>

/* Chat Card */
.chat-card {
    background: rgba(255,255,255,0.05);
    padding: 25px;
    border-radius: 15px;
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    height: 70vh;
}

/* Chat Window */
.chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 15px;
}

/* Message Bubbles */
.message {
    margin-bottom: 15px;
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    position: relative;
}

.user {
    background: #2563eb;
    align-self: flex-end;
}

.ai {
    background: #374151;
    align-self: flex-start;
}

.timestamp {
    font-size: 11px;
    opacity: 0.6;
    margin-top: 4px;
}

/* Input Area */
.input-area {
    display: flex;
    gap: 10px;
}

.input-area input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

.send-btn {
    background: #22c55e;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.send-btn:hover {
    background: #16a34a;
}

.top-actions {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.secondary-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    background: #6b7280;
    color: white;
    cursor: pointer;
}

.secondary-btn:hover {
    background: #4b5563;
}

.typing {
    font-size: 13px;
    opacity: 0.6;
}

</style>
</head>

<body>

<script>
if(!sessionStorage.getItem("userId")){
    window.location.href = "login.html";
}
</script>

<div class="sidebar">
    <div>
        <div class="sidebar-header">
            <div class="dashboard-btn" onclick="goDashboard()">☰</div>
            <h2>HOME</h2>
        </div>

        <ul>
            <li onclick="location.href='materials.html'">Materials</li>
            <li class="active">AI Chatbot</li>
            <li onclick="location.href='summariser.html'">AI Summariser</li>
            <li onclick="location.href='smartquiz.html'">AI Smart Quiz</li>
            <li onclick="location.href='timetable.html'">Timetable</li>
            <li onclick="location.href='assignments.html'">Assignment Tracker</li>
            <li onclick="location.href='grades.html'">Grades</li>
            <li onclick="location.href='progress.html'">Progress Tracker</li>
        </ul>
    </div>

    <div class="logout" onclick="logout()">Logout</div>
</div>

<div class="main">

<div class="header">
    <div style="display:flex;align-items:center;">
        <img src="logo.jpeg" class="logo">
        <h1>Self Study</h1>
    </div>
</div>

<div class="chat-card">

<div class="top-actions">
    <h2>AI Study Assistant</h2>
    <div>
        <button class="secondary-btn" onclick="clearChat()">Clear</button>
        <button class="secondary-btn" onclick="exportChat()">Export</button>
    </div>
</div>

<div class="chat-window" id="chatWindow"></div>

<div class="typing" id="typingIndicator" style="display:none;">
AI is typing...
</div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

</div>
</div>

<script>

let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

const chatWindow = document.getElementById("chatWindow");

function renderChat(){
    chatWindow.innerHTML="";
    chatHistory.forEach(msg=>{
        appendMessage(msg.text, msg.type, msg.time);
    });
}

function appendMessage(text, type, time){
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", type);
    msgDiv.innerHTML = text + `<div class="timestamp">${time}</div>`;
    chatWindow.appendChild(msgDiv);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if(!text) return;

    const time = new Date().toLocaleTimeString();

    chatHistory.push({text, type:"user", time});
    localStorage.setItem("chatHistory", JSON.stringify(chatHistory));

    renderChat();
    input.value="";

    document.getElementById("typingIndicator").style.display="block";

    fetch("http://localhost:5000/api/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: text })
    })
    .then(res => res.json())
    .then(data => {

        const aiTime = new Date().toLocaleTimeString();

        chatHistory.push({
            text: data.reply,
            type:"ai",
            time: aiTime
        });

        localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
        document.getElementById("typingIndicator").style.display="none";
        renderChat();
    })
    .catch(err => {
        console.error(err);
        document.getElementById("typingIndicator").style.display="none";
    });
}

function clearChat(){
    chatHistory=[];
    localStorage.removeItem("chatHistory");
    renderChat();
}

function exportChat(){
    let text="";
    chatHistory.forEach(msg=>{
        text += `${msg.type.toUpperCase()} (${msg.time}): ${msg.text}\n\n`;
    });
    const blob = new Blob([text], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "chat_history.txt";
    link.click();
}

function goDashboard(){
    window.location.href="index.html";
}

function logout(){
    sessionStorage.removeItem("userId");
    window.location.href="login.html";
}

renderChat();

</script>

</body>
</html>
